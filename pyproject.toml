[project]
name = "film-oneri"
version = "0.1.0"
description = "Kişisel, lokal çalışan film öneri uygulaması"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "duckdb",
    "httpx",
    "typer",
    "rich",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
film = "app.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.hatch.build]
dev-mode-dirs = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
